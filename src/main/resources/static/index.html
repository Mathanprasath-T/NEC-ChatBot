<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEC GUIDE</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; height: 600px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #003366; color: white; padding: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 14px; }
        .user-msg { background: #003366; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .bot-msg img { width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; display: block; }
        .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: #fff; align-items: center; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        .btn { background: #003366; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.3s; }
        
        /* Mic on-la irukum pothu red pulse effect */
        .mic-active { background: #ff4b2b !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }
        
        #lang { border-radius: 10px; padding: 5px; border: 1px solid #ccc; font-size: 12px; margin-left: 10px;}
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">NEC GUIDE</div>
    
    <div style="padding: 10px; background: #eee; display: flex; align-items: center;">
        <label style="font-size: 12px; font-weight: bold;">Language:</label>
        <select id="lang">
            <option value="en-US">English</option>
            <option value="ta-IN">Tamil (தமிழ்)</option>
        </select>
    </div>

    <div id="chat-window"></div>

    <div class="input-area">
        <button id="micBtn" class="btn" onclick="startListening()">🎤</button>
        <input type="text" id="userInput" placeholder="Ask something..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button class="btn" onclick="sendMsg()">➤</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const micBtn = document.getElementById('micBtn');

    // PAGE LOAD AAGUM BOTHE WELCOME MESSAGE VARA
    window.onload = function() {
        const welcomeText = "👋 Hi! I’m your NEC campus guide. You can ask questions to find places.";
        
        // Chat window-la message display panna
        const welcomeDiv = document.createElement("div");
        welcomeDiv.className = "msg bot-msg";
        welcomeDiv.innerHTML = `<div>${welcomeText}</div>`;
        chatWindow.appendChild(welcomeDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        // Welcome voice solla (English-la)
        const utterance = new SpeechSynthesisUtterance("Hi! I am your NEC campus guide. You can ask questions or find places.");
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    };

    function startListening() {
        const langSelection = document.getElementById('lang').value;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Chrome browser use pannunga!");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = langSelection;
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            micBtn.classList.add('mic-active');
            console.log("Mic active... Ippo pesunga!");
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('userInput').value = transcript;
            sendMsg();
        };

        recognition.onerror = (e) => {
            console.error("Voice Error: ", e.error);
            micBtn.classList.remove('mic-active');
        };

        recognition.onend = () => {
            micBtn.classList.remove('mic-active');
        };

        recognition.start();
    }

    async function sendMsg() {
        const input = document.getElementById('userInput');
        const query = input.value.trim();
        if (!query) return;

        chatWindow.innerHTML += `<div class="msg user-msg">${query}</div>`;
        input.value = '';
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const res = await fetch(`/api/chat?query=${encodeURIComponent(query)}`);
            const data = await res.json();
            
            let imgHtml = (data.image && data.image !== "none") ? `<img src="/images/${data.image}" alt="Info Image">` : "";
            
            chatWindow.innerHTML += `<div class="msg bot-msg"><div>${data.text}</div>${imgHtml}</div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            speak(data.text);
        } catch (e) {
            console.error("Connection Error:", e);
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        let voices = window.speechSynthesis.getVoices();
        
        const isTamil = /[^\x00-\x7F]/.test(text);
        if (isTamil) {
            let tamilVoice = voices.find(v => v.name.includes('Google') && v.lang.includes('ta'));
            if (!tamilVoice) tamilVoice = voices.find(v => v.lang.includes('ta'));

            if (tamilVoice) {
                utterance.voice = tamilVoice;
                utterance.lang = 'ta-IN';
                utterance.rate = 0.85; 
            }
        } else {
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
        }
        window.speechSynthesis.speak(utterance);
    }

    // Browser voices load aagurathai urudhi panna
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
</script>

</body>
</html>
